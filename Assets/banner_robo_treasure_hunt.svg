<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="300" style="background:#090909; font-family:'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <pattern id="grid-pattern-robo" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1A1A1A" stroke-width="0.75"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="300" fill="#090909"/>
  <rect width="1200" height="300" fill="url(#grid-pattern-robo)"/>

  <!-- Industrial Technical Frame -->
  <rect x="20" y="20" width="1160" height="260" fill="none" stroke="#222222" stroke-width="1"/>
  <rect x="24" y="24" width="1152" height="252" fill="none" stroke="#181818" stroke-width="1"/>

  <!-- Corner Calibration Marks -->
  <path d="M 15 30 L 30 30 M 30 15 L 30 30" stroke="#777777" stroke-width="1.5" fill="none"/>
  <path d="M 1185 30 L 1170 30 M 1170 15 L 1170 30" stroke="#777777" stroke-width="1.5" fill="none"/>
  <path d="M 15 270 L 30 270 M 30 285 L 30 270" stroke="#777777" stroke-width="1.5" fill="none"/>
  <path d="M 1185 270 L 1170 270 M 1170 285 L 1170 270" stroke="#777777" stroke-width="1.5" fill="none"/>

  <!-- Top Metadata Bar -->
  <text x="45" y="52" fill="#666666" font-size="10" letter-spacing="2" font-family="'JetBrains Mono', 'Courier New', monospace">SYS_ID: RTH-TB3-01 // NOETIC-GAZEBO-11 // TELEMETRY: ACTIVE</text>
  <text x="1155" y="52" fill="#666666" font-size="10" letter-spacing="1.5" text-anchor="end" font-family="'JetBrains Mono', 'Courier New', monospace">SPEC: ROBOTIC STEALTH INFILTRATION</text>
  <line x1="45" y1="62" x2="1155" y2="62" stroke="#222222" stroke-width="1"/>

  <!-- Main Display Typography -->
  <text x="45" y="135" fill="#FFFFFF" font-size="54" font-weight="700" letter-spacing="-1">ROBO TREASURE HUNT</text>
  <text x="45" y="168" fill="#888888" font-size="13" font-weight="500" letter-spacing="3" text-transform="uppercase">Stealth Retrieval Simulation // Differential Drive Robotics</text>

  <!-- Technical Spec Matrix (Right Side) -->
  <g transform="translate(860, 95)" font-family="'JetBrains Mono', 'Courier New', monospace">
    <rect x="0" y="0" width="295" height="150" fill="#0E0E0E" stroke="#262626" stroke-width="1"/>
    
    <text x="15" y="24" fill="#555555" font-size="9" letter-spacing="1">SYSTEM PARAMETERS</text>
    <line x1="15" y1="32" x2="280" y2="32" stroke="#1F1F1F" stroke-width="1"/>
    
    <text x="15" y="52" fill="#777777" font-size="10">ROBOT PLATFORM</text>
    <text x="280" y="52" fill="#DDDDDD" font-size="10" text-anchor="end">TurtleBot3 Burger</text>
    
    <text x="15" y="74" fill="#777777" font-size="10">ENVIRONMENT</text>
    <text x="280" y="74" fill="#DDDDDD" font-size="10" text-anchor="end">Gazebo 11 (Museum 3D)</text>
    
    <text x="15" y="96" fill="#777777" font-size="10">SENSING &amp; PERCEPTION</text>
    <text x="280" y="96" fill="#DDDDDD" font-size="10" text-anchor="end">LDS-01 LiDAR + FPV Cam</text>
    
    <text x="15" y="118" fill="#777777" font-size="10">OPERATOR HUD</text>
    <text x="280" y="118" fill="#DDDDDD" font-size="10" text-anchor="end">PyQt5 Stealth Station</text>
    
    <text x="15" y="140" fill="#777777" font-size="10">CONTROL DYNAMICS</text>
    <text x="280" y="140" fill="#DDDDDD" font-size="10" text-anchor="end">Discrete Step / 2.0x Boost</text>
  </g>

  <!-- Bottom Technical Legend -->
  <line x1="45" y1="230" x2="830" y2="230" stroke="#222222" stroke-width="1"/>
  <g transform="translate(45, 252)" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="10" fill="#777777">
    <text x="0" y="0">MUSEUM ARTIFACTS: <tspan fill="#CCCCCC">[IDOL // GEM // CROWN]</tspan></text>
    <text x="310" y="0">SECURITY ZONES: <tspan fill="#CCCCCC">3 DETECTORS [TIMED]</tspan></text>
    <text x="590" y="0">MISSION TARGET: <tspan fill="#CCCCCC">300 PTS STEALTH</tspan></text>
  </g>

  <!-- Precision Crosshairs -->
  <circle cx="830" cy="145" r="4" fill="none" stroke="#444444" stroke-width="1"/>
  <line x1="830" y1="135" x2="830" y2="155" stroke="#333333" stroke-width="1"/>
  <line x1="820" y1="145" x2="840" y2="145" stroke="#333333" stroke-width="1"/>
</svg>
